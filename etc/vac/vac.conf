# URL base del servidor VAS (sin ruta final)
VAS_HOST="http://10.0.0.1:8000"

# Espera entre reintentos cuando no hay conexion con VAS
RETRY_SECONDS=60

# Espera entre comprobaciones de version remota
CHECK_SECONDS=300

# Ruta local de configuracion de Veyon (objetivo: computers.json)
VEYON_CONFIG="/etc/veyon/computers.json"

# Location/ubicacion de destino para importar equipos en Veyon
VEYON_ROOM="Autoregistrados"

# Endpoint servido por VAS para la configuracion
CONFIG_ENDPOINT="/config"
