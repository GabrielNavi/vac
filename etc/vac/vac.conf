# Configuración del cliente VAC
# Nota: Puedes añadir sobreescrituras en /etc/vac/vac.conf.d/*.conf
# (se aplican en orden lexical, después de este archivo).

# URL base del servidor VAS (sin barra final)
VAS_HOST="http://10.0.0.1:8000"

# Espera entre reintentos cuando no hay conexión con VAS
RETRY_SECONDS=60

# Espera entre comprobaciones de versión remota y selfcheck de datos (hostname/IP/MAC).
# Debe ser notablemente menor que TTL_INACTIVE_DAYS de VAS (en segundos).
# Con TTL_INACTIVE_DAYS=30d, cualquier valor < 2.500.000 s es seguro.
CHECK_SECONDS=300

# Intervalo entre señales de liveness (POST /heartbeat sin selfcheck).
# Vacío o no definido: igual a CHECK_SECONDS → comportamiento anterior (backwards compatible).
#
# Modos de operación desacoplados:
#   CHECK_SECONDS < HEARTBEAT_SECONDS → detecta cambios de datos rápidamente,
#                                       heartbeat menos frecuente.
#   CHECK_SECONDS > HEARTBEAT_SECONDS → liveness frecuente, selfcheck más lento.
#                                       Útil para detectar caídas rápidamente sin
#                                       sobrecargar el selfcheck.
#
# Ejemplo — reactivo a cambios de IP/hostname:
#   CHECK_SECONDS=60
#   HEARTBEAT_SECONDS=300
#
# Ejemplo — monitorización de disponibilidad:
#   CHECK_SECONDS=300
#   HEARTBEAT_SECONDS=60
#
# HEARTBEAT_SECONDS=300

# Descargar y mantener una copia local del inventario en /var/lib/vac/clients.json.
# true  → VAC descarga GET /clients tras cada cambio de versión (comportamiento original).
# false → VAC solo se registra; no replica la base de datos pública.
SYNC_CLIENTS=true

# Habilitar campos extra (extra_imperative / extra_informative) en el registro.
# true  → VAC ejecuta hooks y envía el merge resultante a VAS.
# false → VAC envía {} en ambos campos (borrado explícito en VAS); ignora hooks.
EXTRAS_ENABLED=false

# TTL de claves extras en segundos (0 = sin expiración).
# Una clave cuyo timestamp supere este valor se elimina del estado interno antes
# del siguiente merge, con aviso en log. Útil para detectar productores silenciados.
# EXTRAS_TTL=86400

# Directorios de hooks cíclicos (requiere EXTRAS_ENABLED=true).
# VAC ejecuta en orden léxico todos los scripts ejecutables del directorio.
# La clave de cada script es su basename sin extensión (ej: "10-cups.sh" → "cups").
# Cada script debe imprimir un objeto JSON en stdout y salir con código 0.
# En caso de error: WARN en log, la clave conserva su valor anterior (no destructivo).
# extra_imperative  → cambios disparan bump_version en VAS (datos de red/gestión).
# extra_informative → solo informativo, nunca dispara versión (inventario HW, etc.).
#
# EXTRAS_IMPERATIVE_HOOKS_DIR=/etc/vac/extras_imperative.d
# EXTRAS_INFORMATIVE_HOOKS_DIR=/etc/vac/extras_informative.d

# Nivel de logging: no (silencio total), normal (eventos importantes), debug (detallado).
# Filtrar mensajes debug en journalctl: journalctl -u vac | grep '\[DEBUG\]'
LOG_LEVEL=normal

# Fichero de log adicional con timestamp ISO-8601 UTC (vacío = solo stdout/journald).
# LOG_FILE=/var/log/vac/vac.log

# Paralelización: lanza vac-sub-manager al arrancar para gestionar sub-instancias.
# Cada sub-instancia en /etc/vac/vac.sub/<name>/ registra en un VAS diferente
# con un UUID derivado del UUID base del equipo (v5, determinista).
# true  → vac arranca vac-sub-manager en background al iniciarse.
# false → sin sub-instancias (por defecto).
# Ver también: vac-sub.service (supervisor independiente sin instancia principal).
PARALLELIZATION=false

# Transformación VAT del inventario local (clients.json).
# Requiere paquete vx-dga-l-vat instalado.
# true  → aplica el preset indicado a clients.json tras cada descarga,
#          antes de que cualquier consumidor (SOURCE=vac) lo lea.
# false → sin transformación (por defecto).
# USE_VAT=false
# VAT_PRESET=
