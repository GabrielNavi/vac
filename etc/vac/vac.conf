# Configuración del cliente VAC
# Sobreescrituras: /etc/vac/vac.conf.d/*.conf
# Referencia exhaustiva: /usr/share/vac/vac.conf.defaults

# IP o hostname del servidor VAS (sin scheme; usa VAS_SCHEME para http/https)
VAS_HOST=10.0.0.1

# Esquema de conexión: http (default) | https
# VAS_SCHEME=http

# Espera entre reintentos por error de conexión (segundos)
RETRY_SECONDS=60

# Espera entre selfchecks y comparación de versión (segundos)
# Debe ser notablemente menor que TTL_INACTIVE de VAS
CHECK_SECONDS=300

# Intervalo de heartbeat de liveness (vacío = igual a CHECK_SECONDS)
# HEARTBEAT_SECONDS=300

# Descargar copia local del inventario en /var/lib/vac/clients.json
SYNC_CLIENTS=false

# Habilitar campos extra (extra_imperative / extra_informative)
EXTRAS_ENABLED=true

# TTL de claves extra en segundos (0 = sin expiración)
EXTRAS_TTL=86400

# Directorios de hooks cíclicos de extras (requiere EXTRAS_ENABLED=true)
EXTRAS_IMPERATIVE_HOOKS_DIR=/etc/vac/extras_imperative.d
EXTRAS_INFORMATIVE_HOOKS_DIR=/etc/vac/extras_informative.d

# Nivel de log: no | normal | debug
LOG_LEVEL=normal

# Log adicional a fichero con timestamp UTC (vacío = solo stdout/journald)
# LOG_FILE=/var/log/vac/vac.log

# Modo de paralelización con sub-instancias:
#   both          → bucle principal + sub-instancias (default)
#   only_parallel → solo sub-instancias (exec vac-sub-manager, main silenciado)
#   only_main     → solo bucle principal, sin sub-instancias
# Las sub-instancias se detectan por /etc/vac/vac.sub/*/vac.conf + .enabled
PARALLEL_MODE=both

# Transformación VAT del inventario local (requiere vx-dga-l-vat)
# USE_VAT=false
# VAT_PRESET=
